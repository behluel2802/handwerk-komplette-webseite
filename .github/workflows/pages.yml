# Öffentliche Demo auf GitHub Pages (Schritt 12b, rechtssicher seit P2: Briefing R1–R14)
# Baut den Demo-Build (npm run build:demo): Impressum/Datenschutz mit den Betreiberdaten, Hinweisleiste, noindex auf
# allen Seiten, Formulare senden nichts, Anruf-Buttons wählen nicht. Veröffentlicht wird ausschließlich frontend/dist/.
#
# Einmalig nötig:
#   - Settings → Pages → Source „GitHub Actions“
#   - Settings → Secrets and variables → Actions → Variables: OPERATOR_NAME, OPERATOR_STREET, OPERATOR_ZIP,
#     OPERATOR_CITY, OPERATOR_EMAIL, OPERATOR_PHONE, OPERATOR_STATE (Vorlage: frontend/.env.demo.example).
#     Fehlt eine, bricht der Build ab – es wird nie eine Demo ohne gültiges Impressum veröffentlicht.
#
# Vorerst nur manuell (R13): automatischer Deploy bei Push wird in P7 wieder aktiviert,
# wenn Impressum und Datenschutzerklärung final geprüft sind.

name: Demo auf GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deploy gleichzeitig; ein laufender wird nicht abgebrochen
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Exakt die Versionen aus package-lock.json
      - run: npm ci

      # Fertige Bilder vom letzten Lauf wiederverwenden (AVIF-Erzeugung dauert ca. 1 Minute).
      # Das Skript prüft per Fingerabdruck selbst, was sich geändert hat.
      - uses: actions/cache@v4
        with:
          path: |
            frontend/img
            frontend/public/favicon.ico
            frontend/public/icon.svg
            frontend/public/apple-touch-icon.png
          key: images-${{ hashFiles('frontend/img-src/**', 'frontend/images.config.js', 'frontend/scripts/images.js') }}
          restore-keys: images-

      # Erzeugt zuerst die Bilder (img-src/ → img/), dann den Demo-Build in dist/
      - run: npm run build:demo
        env:
          BASE: /${{ github.event.repository.name }}/
          OPERATOR_NAME: ${{ vars.OPERATOR_NAME }}
          OPERATOR_STREET: ${{ vars.OPERATOR_STREET }}
          OPERATOR_ZIP: ${{ vars.OPERATOR_ZIP }}
          OPERATOR_CITY: ${{ vars.OPERATOR_CITY }}
          OPERATOR_EMAIL: ${{ vars.OPERATOR_EMAIL }}
          OPERATOR_PHONE: ${{ vars.OPERATOR_PHONE }}
          OPERATOR_STATE: ${{ vars.OPERATOR_STATE }}

      # Vorkomprimierte .br/.gz nur für das eigene Backend – GitHub Pages komprimiert selbst
      - name: Nur die gebaute Seite kopieren
        run: |
          cp -r frontend/dist _site
          find _site \( -name '*.br' -o -name '*.gz' \) -delete

      # Sicherheitsnetz: jede Seite muss noindex tragen (setzt das Layout im Demo-Modus)
      - name: noindex prüfen
        run: |
          missing=$(find _site -name '*.html' -exec grep -L 'name="robots" content="noindex"' {} +)
          [ -z "$missing" ] || { echo "noindex fehlt in: $missing"; exit 1; }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
